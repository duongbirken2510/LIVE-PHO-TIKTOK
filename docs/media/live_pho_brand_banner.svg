<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1260" width="2400" height="1260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140907" />
      <stop offset="45%" stop-color="#23100b" />
      <stop offset="100%" stop-color="#0f141c" />
    </linearGradient>
    <radialGradient id="glowAmber" cx="25%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#dc2626" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRuby" cx="82%" cy="22%" r="40%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="squircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#e7e5e4" />
    </linearGradient>
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#291510" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#1e1b24" stop-opacity="0.92" />
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="2400" height="1260" fill="url(#bgGrad)" />
  <rect width="2400" height="1260" fill="url(#glowAmber)" />
  <rect width="2400" height="1260" fill="url(#glowRuby)" />

  <!-- Decorative Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="210" x2="2400" y2="210" />
    <line x1="0" y1="420" x2="2400" y2="420" />
    <line x1="0" y1="630" x2="2400" y2="630" />
    <line x1="0" y1="840" x2="2400" y2="840" />
    <line x1="0" y1="1050" x2="2400" y2="1050" />
    <line x1="400" y1="0" x2="400" y2="1260" />
    <line x1="800" y1="0" x2="800" y2="1260" />
    <line x1="1200" y1="0" x2="1200" y2="1260" />
    <line x1="1600" y1="0" x2="1600" y2="1260" />
    <line x1="2000" y1="0" x2="2000" y2="1260" />
  </g>

  <!-- Outer Frame Border -->
  <rect x="44" y="44" width="2312" height="1172" rx="36" fill="none" stroke="#fbbf24" stroke-opacity="0.22" stroke-width="2" />

  <!-- LEFT: 3D Squircle Icon Card -->
  <g transform="translate(135, 225)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="640" height="640" rx="145" fill="url(#squircleGrad)" stroke="#fbbf24" stroke-width="5" stroke-opacity="0.65" />
    <rect x="22" y="22" width="596" height="596" rx="128" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.14" />

    <!-- Signboard at Top of Icon -->
    <rect x="85" y="62" width="470" height="76" rx="16" fill="#7f1d1d" stroke="#fbbf24" stroke-width="4" />
    <text x="320" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="33" font-weight="800" fill="#fde68a" text-anchor="middle" letter-spacing="2">PHỞ BÒ GIA TRUYỀN</text>

    <!-- Steaming S-Curves -->
    <path d="M235 280 C215 240, 260 205, 238 165" fill="none" stroke="#fde68a" stroke-width="9" stroke-linecap="round" stroke-opacity="0.78" />
    <path d="M320 265 C300 220, 348 185, 322 145" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-opacity="0.88" />
    <path d="M405 280 C385 240, 430 205, 408 165" fill="none" stroke="#fde68a" stroke-width="9" stroke-linecap="round" stroke-opacity="0.78" />

    <!-- Chopsticks -->
    <line x1="170" y1="265" x2="520" y2="215" stroke="#d97706" stroke-width="14" stroke-linecap="round" />
    <line x1="185" y1="292" x2="530" y2="248" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" />

    <!-- Broth & Toppings Surface -->
    <ellipse cx="320" cy="340" rx="205" ry="62" fill="#b45309" stroke="#fde68a" stroke-width="5" />
    <ellipse cx="320" cy="342" rx="182" ry="48" fill="#d97706" />
    <!-- Noodles -->
    <path d="M185 340 Q250 310 325 342 T455 336" fill="none" stroke="#fffbeb" stroke-width="10" stroke-linecap="round" />
    <path d="M200 356 Q270 328 340 356 T440 352" fill="none" stroke="#fef3c7" stroke-width="9" stroke-linecap="round" />
    <!-- Rare Beef & Egg Yolk & Scallions -->
    <ellipse cx="245" cy="336" rx="42" ry="20" fill="#b91c1c" stroke="#fecaca" stroke-width="3" />
    <ellipse cx="390" cy="346" rx="38" ry="18" fill="#991b1b" stroke="#fecaca" stroke-width="3" />
    <circle cx="325" cy="336" r="24" fill="#fffbeb" />
    <circle cx="325" cy="336" r="13" fill="#f97316" />
    <circle cx="285" cy="358" r="8" fill="#22c55e" />
    <circle cx="362" cy="322" r="9" fill="#16a34a" />
    <circle cx="215" cy="352" r="7" fill="#22c55e" />

    <!-- Ceramic Pho Bowl Body -->
    <path d="M115 340 C125 485, 215 535, 320 535 C425 535, 515 485, 525 340 Z" fill="url(#bowlGrad)" />
    <!-- Blue Ceramic Dragon/Pattern Rim Stripe -->
    <path d="M126 382 Q320 426 514 382" fill="none" stroke="#1d4ed8" stroke-width="14" stroke-opacity="0.85" />
    <!-- Bowl Foot -->
    <rect x="240" y="528" width="160" height="32" rx="12" fill="#d6d3d1" />

    <!-- Bottom Pill on Squircle -->
    <rect x="130" y="572" width="380" height="44" rx="22" fill="#0f172a" fill-opacity="0.88" stroke="#fbbf24" stroke-width="2" />
    <text x="320" y="601" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#fde68a" text-anchor="middle">● LIVE 9:16 • THREE.JS 3D • PORT 4011</text>
  </g>

  <!-- RIGHT: Typography, Subtitle & Feature Badges -->
  <g transform="translate(855, 215)">
    <!-- Top Tag Pill -->
    <rect x="0" y="0" width="720" height="54" rx="27" fill="#7f1d1d" fill-opacity="0.7" stroke="#fbbf24" stroke-width="2" />
    <text x="360" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#fde68a" text-anchor="middle" letter-spacing="1.5">🍜 TIKTOK LIVE 3D INTERACTIVE GAME SUITE • v2.0</text>

    <!-- Main Title Wordmark -->
    <text x="0" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="94" font-weight="900" fill="#ffffff" letter-spacing="1">LIVE-PHO-TIKTOK</text>
    <text x="0" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" fill="url(#goldGrad)">Phở Cô Ba 3D — Quán Phở Đêm Tự Động 100%</text>

    <!-- Bilingual Descriptions -->
    <text x="0" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="27.5" font-weight="600" fill="#f1f5f9">[VI] Mô phỏng quán phở đêm 3D thời gian thực: Khách tặng quà xếp hàng, Cô Ba AI trần phở &amp; gọi tên cảm ơn</text>
    <text x="0" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="500" fill="#94a3b8">[EN] Real-Time 3D Vietnamese Pho Restaurant for TikTok LIVE with 3-Tier AI Voice, Direct Webcast &amp; Web Audio</text>

    <!-- 4 Feature Pills (2x2 Grid, generous 690px width each, centered text) -->
    <g transform="translate(0, 425)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="690" height="84" rx="22" fill="url(#pillBg)" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.7" />
      <text x="345" y="51" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#fde68a" text-anchor="middle">🥩 6 Khay Nguyên Liệu &amp; 8 Món Phở 3D (Three.js)</text>

      <!-- Pill 2 -->
      <rect x="715" y="0" width="690" height="84" rx="22" fill="url(#pillBg)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.7" />
      <text x="1060" y="51" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#bae6fd" text-anchor="middle">🎙️ Giọng AI Cô Ba (VieNeu / Edge Hoài My / Google)</text>

      <!-- Pill 3 -->
      <rect x="0" y="110" width="690" height="84" rx="22" fill="url(#pillBg)" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.7" />
      <text x="345" y="161" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#a7f3d0" text-anchor="middle">⚡ Nối Trực Tiếp TikTok LIVE + Cầu Nối TikFinity</text>

      <!-- Pill 4 -->
      <rect x="715" y="110" width="690" height="84" rx="22" fill="url(#pillBg)" stroke="#f472b6" stroke-width="2.5" stroke-opacity="0.7" />
      <text x="1060" y="161" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#fbcfe8" text-anchor="middle">🔊 Web Audio 90 BPM Không Bản Quyền &amp; Ducking</text>
    </g>
  </g>

  <!-- Footer Bar -->
  <g transform="translate(135, 1045)">
    <rect x="0" y="0" width="2130" height="96" rx="24" fill="#090d16" fill-opacity="0.82" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />
    <text x="45" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#fde68a">👨‍💻 Designed &amp; Engineered by Duong Birken</text>
    <text x="1065" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#38bdf8" text-anchor="middle">🌐 https://duongbirken.deta.vn</text>
    <text x="2085" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#cbd5e1" text-anchor="end">📦 github.com/duongbirken2510/LIVE-PHO-TIKTOK</text>
  </g>
</svg>
