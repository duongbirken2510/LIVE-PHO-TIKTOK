    <text x="42" y="337" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#e2e8f0">• Exponential Backoff Reconnect</text>
    <text x="42" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#fde68a">• Sự kiện: GIFT, MEMBER, LIKE, CHAT</text>

