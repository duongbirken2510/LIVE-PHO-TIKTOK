    <text x="42" y="644" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#e2e8f0">• Không gửi lại HTTP mập mờ</text>
    <text x="42" y="677" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#e2e8f0">  (chống cộng trùng điểm VIP)</text>
