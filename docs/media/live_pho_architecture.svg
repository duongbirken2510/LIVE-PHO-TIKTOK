    <text x="210" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#fda4af" text-anchor="middle">A. Kết nối trực tiếp (@username)</text>
    <text x="210" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#cbd5e1" text-anchor="middle">tiktok-live-connector v2.5</text>
    <text x="42" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#e2e8f0">• Không cần phần mềm trung gian</text>
    <text x="42" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#e2e8f0">• Tự tính delta combo quà (streak)</text>
    <text x="42" y="271" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#e2e8f0">• Map tên/ID quà &amp; bậc xu (1..1000+)</text>
