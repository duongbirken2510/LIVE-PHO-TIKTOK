    <text x="36" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#e2e8f0">• OrderQueue ưu tiên đơn thật trước đơn thử</text>
    <text x="36" y="337" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#e2e8f0">• 4 bàn inox ghế nhựa xanh/đỏ (ăn 9 giây)</text>
