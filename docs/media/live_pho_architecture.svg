    <text x="42" y="337" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#e2e8f0">• Lưu tự động settings.json</text>
    <text x="42" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#fda4af">• POST /api/server/shutdown (Giải phóng</text>
